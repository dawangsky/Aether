[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lottery-quant"
version = "0.1.0"
description = "双色球与大乐透量化分析预测 CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31.0",
  "pandas>=2.0.0",
  "rich>=13.0.0",
]

[project.scripts]
lottery = "lottery.cli:main"

[tool.setuptools.packages.find]
include = ["lottery*"]
