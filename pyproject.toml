[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lottery-quant"
version = "0.1.0"
description = "双色球与大乐透量化分析预测 CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31.0",
  "pandas>=2.0.0",
  "rich>=13.0.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.0.0",
]

[project.scripts]
lottery = "lottery.cli:main"
lottery-api = "lottery.api.__main__:main"

[tool.setuptools.packages.find]
include = ["lottery*"]
