name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  build-mac:
    name: Build macOS
    runs-on: macos-14
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - run: npm ci
      - run: npm run build

      - name: Package
        run: |
          set -o pipefail
          npx electron-builder --mac dmg --arm64 --x64 --publish never 2>&1 | tee package.log
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dump package log on failure
        if: failure()
        run: |
          echo '----- package.log (tail) -----'
          tail -n 120 package.log || true
          # Surface into Actions annotations (readable via API)
          tail -n 40 package.log | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: aether-mac
          path: desktop/release/*.dmg
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: aether-mac-log
          path: desktop/package.log
          if-no-files-found: ignore

  build-win:
    name: Build Windows
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - run: npm ci
      - run: npm run build

      - name: Package
        shell: bash
        run: |
          set -o pipefail
          npx electron-builder --win nsis portable --x64 --publish never \
            -c.win.signAndEditExecutable=false \
            2>&1 | tee package.log
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dump package log on failure
        if: failure()
        shell: bash
        run: |
          echo '----- package.log (tail) -----'
          tail -n 120 package.log || true
          tail -n 40 package.log | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: aether-win
          path: desktop/release/*.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: aether-win-log
          path: desktop/package.log
          if-no-files-found: ignore

  release:
    name: Publish GitHub Release
    needs: [build-mac, build-win]
    if: always() && needs.build-mac.result == 'success' && needs.build-win.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: aether-mac
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: aether-win
          path: dist
      - run: ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.1.2' }}
          name: Aether ${{ github.ref_type == 'tag' && github.ref_name || 'v0.1.2' }}
          generate_release_notes: true
          files: dist/*
          body: |
            ## Downloads
            - macOS arm64 / x64 DMG
            - Windows NSIS setup + portable exe

            Requires local Python 3.10+ for the bundled backend (`pip install -r requirements.txt`).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
