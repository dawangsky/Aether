name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  build-mac:
    name: Build macOS
    runs-on: macos-14
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Package
        id: package
        run: |
          set -o pipefail
          npx electron-builder --mac dmg --arm64 --x64 --publish never 2>&1 | tee package.log
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Comment failure log
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "### macOS package failed"
            echo
            echo '```'
            tail -n 80 package.log || true
            echo '```'
          } > /tmp/body.md
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -d "$(python3 -c 'import json;print(json.dumps({"body":open("/tmp/body.md").read()}))')"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: aether-mac
          path: desktop/release/*.dmg
          if-no-files-found: error

  build-win:
    name: Build Windows
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Package
        shell: bash
        run: |
          set -o pipefail
          npx electron-builder --win nsis portable --x64 --publish never \
            -c.win.signAndEditExecutable=false \
            2>&1 | tee package.log
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Comment failure log
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "### Windows package failed"
            echo
            echo '```'
            tail -n 80 package.log || true
            echo '```'
          } > /tmp/body.md
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -d "$(python -c 'import json;print(json.dumps({"body":open("/tmp/body.md").read()}))')"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: aether-win
          path: desktop/release/*.exe
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build-mac, build-win]
    if: always() && needs.build-mac.result == 'success' && needs.build-win.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: aether-mac
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: aether-win
          path: dist
      - run: ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.1.3' }}
          name: Aether ${{ github.ref_type == 'tag' && github.ref_name || 'v0.1.3' }}
          generate_release_notes: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
