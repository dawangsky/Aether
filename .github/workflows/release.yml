name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  build-mac:
    name: Build macOS
    runs-on: macos-14
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify Electron binary
        run: |
          node -e "console.log(require('electron'))"
          test -x "$(node -e "console.log(require('electron'))")"

      - name: Build
        run: npm run build

      - name: Package
        run: npx electron-builder --mac dmg --arm64 --x64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aether-mac
          path: desktop/release/*.dmg
          if-no-files-found: error

  build-win:
    name: Build Windows
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify Electron binary
        shell: bash
        run: |
          node -e "console.log(require('electron'))"

      - name: Build
        run: npm run build

      - name: Package
        run: npx electron-builder --win nsis portable --x64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aether-win
          path: desktop/release/*.exe
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build-mac, build-win]
    if: always() && needs.build-mac.result == 'success' && needs.build-win.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: aether-mac
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: aether-win
          path: dist

      - name: List
        run: ls -la dist

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.1.1' }}
          name: Aether ${{ github.ref_type == 'tag' && github.ref_name || 'v0.1.1' }}
          generate_release_notes: true
          files: dist/*
          body: |
            ## Downloads
            - macOS arm64: `Aether-*-mac-arm64.dmg`
            - macOS x64: `Aether-*-mac-x64.dmg`
            - Windows setup: `Aether-*-win-x64-setup.exe`
            - Windows portable: `Aether-*-win-x64-portable.exe`

            Requires local Python 3.10+ and `pip install -r requirements.txt` for bundled backend.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
